name: Workset
options:
  bundleIdPrefix: com.jaredgantt
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: XMH4AVFC78
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Workset:
    type: application
    platform: iOS
    sources: [Workset]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.workset
        # Declared so App Store Connect does not stop every upload for an export
        # compliance answer. The app ships no encryption of its own.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: Workset Watch App
        embed: true

  Workset Watch App:
    type: application
    platform: watchOS
    sources:
      - "Workset Watch App"
      - Algorithm/Swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.workset.watchkitapp
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.jaredgantt.workset
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        # Motion capture during a set needs an active workout session, or the
        # watch suspends the app on wrist-down and 48-71% of samples are lost.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Workset reads workout data to keep motion recording alive while your wrist is down."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Workset records a workout session so motion capture continues during your set."
        INFOPLIST_KEY_NSMotionUsageDescription: "Workset uses wrist motion to count your repetitions."
        INFOPLIST_KEY_WKBackgroundModes: workout-processing

  workset-verify:
    type: tool
    platform: macOS
    sources:
      - Algorithm/Swift
      - Tools/Verify
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.workset.verify
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
