name: Workset
options:
  bundleIdPrefix: com.jaredgantt
  deploymentTarget:
    iOS: "18.0"
    watchOS: "11.0"
  createIntermediateGroups: true

packages:
  # The rep counter, from a private package. Interface/RepCounter.swiftinterface is
  # its public surface.
  RepCounter:
    url: git@github.com:JJGantt/Workset-Algorithms.git
    exactVersion: 1.0.0

settings:
  base:
    DEVELOPMENT_TEAM: XMH4AVFC78
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "22"
    GENERATE_INFOPLIST_FILE: YES

targets:
  Workset:
    type: application
    platform: iOS
    sources: [Workset]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.workset
        # "Workset" was taken on the App Store, so the record is "Watchset". The
        # name under the icon matches the store rather than the project.
        INFOPLIST_KEY_CFBundleDisplayName: Watchset
        # These belong on the PHONE target too, even though only the watch touches
        # CoreMotion and HealthKit. Apple's static scan reads the whole IPA and
        # attributes the embedded watch binary's API use to the top-level bundle,
        # which rejected build 3 and 4 with ITMS-90683 after the upload had already
        # reported success.
        INFOPLIST_KEY_NSMotionUsageDescription: "Watchset uses wrist motion to count your repetitions."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Watchset reads workout data to keep rep counting alive while your wrist is down."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Watchset records a workout session so rep counting continues during your set."
        # Declared so App Store Connect does not stop every upload for an export
        # compliance answer. The app ships no encryption of its own.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPhone only. The phone app exists to carry the watch app; declaring iPad
        # support would oblige it to handle all four orientations for multitasking,
        # which it has no reason to do.
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - target: Workset Watch App
        embed: true

  Workset Watch App:
    type: application
    platform: watchOS
    sources:
      - "Workset Watch App"
    dependencies:
      - package: RepCounter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaredgantt.workset.watchkitapp
        # Without this, HKHealthStore.requestAuthorization simply fails, capture
        # never starts, and the Start button appears to do nothing. The usage
        # strings alone are not enough — the entitlement is separate.
        CODE_SIGN_ENTITLEMENTS: Workset Watch App/Workset Watch App.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Watchset
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.jaredgantt.workset
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: YES
        # Motion capture during a set needs an active workout session, or the
        # watch suspends the app on wrist-down and 48-71% of samples are lost.
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Watchset reads workout data to keep rep counting alive while your wrist is down."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Watchset records a workout session so rep counting continues during your set."
        INFOPLIST_KEY_NSMotionUsageDescription: "Watchset uses wrist motion to count your repetitions."
        INFOPLIST_KEY_WKBackgroundModes: workout-processing
