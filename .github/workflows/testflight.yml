# Build Watchset (the iPhone carrier app with the watch app inside it) and upload it to TestFlight,
# from a GitHub-hosted Mac. The same build as STATE.md § Releasing, for when the owner's Mac is away;
# adapted from status-hub's ios-testflight.yml, whose comments give the reasons behind each step.
#
# The build number is whatever project.yml says, exactly as for a build made on the Mac: bump
# CURRENT_PROJECT_VERSION and push before running this. A number TestFlight has already seen fails
# at the validate step, before anything is uploaded.
#
# Triggered deliberately (a tag or a manual run), never on push: every run is a real TestFlight build.
name: TestFlight

on:
  push:
    tags: ['ios-*']
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false    # never kill a half-finished upload

defaults:
  run:
    shell: bash    # bash -eo pipefail, so `xcodebuild … | tail` fails when xcodebuild does

jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 45

    env:
      ASC_KEY_ID: P8Y337A8RC
      ASC_ISSUER_ID: 141a8ead-b829-4e58-b9ff-b8c95f8c4ed9
      TEAM_ID: XMH4AVFC78

    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Import the signing certificates
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          DEV_P12: ${{ secrets.IOS_DEV_P12 }}
          DEV_P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 -u "$KEYCHAIN"
          echo "$P12" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # The permanent development identity; without it automatic signing mints a new
          # development certificate every run until the account hits Apple's limit.
          echo "$DEV_P12" | base64 --decode > /tmp/dev.p12
          security import /tmp/dev.p12 -k "$KEYCHAIN" -P "$DEV_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f /tmp/dist.p12 /tmp/dev.p12
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Install the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          cp ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 ~/private_keys/
          chmod 600 ~/.appstoreconnect/private_keys/*.p8 ~/private_keys/*.p8

      # The rep counter is the private package JJGantt/Workset-Algorithms, fetched over SSH. The key
      # is a read-only deploy key on that repo. `-scmProvider system` below makes xcodebuild resolve
      # packages with the system git, which reads ~/.ssh; its built-in client does not.
      - name: Install the counter package's deploy key
        env:
          DEPLOY_KEY: ${{ secrets.WORKSET_ALGORITHMS_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null

      # Holds the device token the data layer accepts; the build fails without it.
      - name: Write Config/Secrets.xcconfig
        env:
          XCCONFIG: ${{ secrets.WORKSET_SECRETS_XCCONFIG }}
        run: printf '%s\n' "$XCCONFIG" > Config/Secrets.xcconfig

      - name: Generate the Xcode project
        run: brew install xcodegen >/dev/null && xcodegen generate

      - name: Archive
        run: |
          xcodebuild -project Workset.xcodeproj -scheme Workset \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath /tmp/Workset.xcarchive \
            -scmProvider system \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive 2>&1 | tail -40

      - name: Export the ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath /tmp/Workset.xcarchive \
            -exportPath /tmp/export \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" 2>&1 | tail -30
          ls -la /tmp/export

      - name: Upload to TestFlight
        run: |
          IPA=$(ls /tmp/export/*.ipa | head -1)
          xcrun altool --validate-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -15
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tail -15

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-${{ github.run_number }}
          path: |
            /tmp/export/*.ipa
            /tmp/Workset.xcarchive/dSYMs
          retention-days: 14
          if-no-files-found: warn
